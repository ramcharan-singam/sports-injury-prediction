services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: injurysense-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: uploads

  # 2. Frontend Static Site (React / Vite)
  - type: web
    name: injurysense-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: injurysense-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
